name: Trial

on:
  workflow_dispatch:
    inputs:
      email_provider:
        description: Email provider
        required: true
        default: emailfake
        type: choice
        options:
          - 1secmail
          - guerrillamail
          - developermail
          - mailticking
          - fakemail
          - inboxes
          - incognitomail
          - emailfake

permissions:
  actions: write
  contents: read

jobs:
  trial-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete older workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.run_number) | reverse | .[2:][] | .id' |
          while read -r run_id; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Retriev trial key
        run: pnpm start -- --email-provider "${{ inputs.email_provider }}"

      - name: Publish result
        if: always()
        shell: bash
        run: |
          echo '## Trial key' >> "$GITHUB_STEP_SUMMARY"
          if ls ./*-output.txt >/dev/null 2>&1; then
            cat ./*-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No key file was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
